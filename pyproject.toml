[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oresecstitch"
version = "1.0.0"
description = "OreSecStitch: reconstructing closed triangulated surfaces from planar geological contour stacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
authors = [{ name = "OreSecStitch authors" }]
license = { text = "GPL-3.0-only" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
experiments = ["PyYAML>=6.0"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/CloudComputer/OreSecStitch"
Issues = "https://github.com/CloudComputer/OreSecStitch/issues"

[tool.setuptools]
packages = ["oresecstitch", "drivers"]
include-package-data = true

[tool.setuptools.package-data]
oresecstitch = ["*.pyd", "dlls/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
